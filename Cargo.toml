[package]
name = "shodh-memory"
version = "0.2.0"
edition = "2021"
authors = ["Shodh Team <29.varuns@gmail.com>"]
description = "Persistent cognitive memory for AI agents and robots — Hebbian learning, knowledge graph, spatial recall. Zenoh/ROS2 native. Single binary, runs offline."
license = "Apache-2.0"
repository = "https://github.com/varun29ankuS/shodh-memory"
homepage = "https://github.com/varun29ankuS/shodh-memory"
readme = "README-rust.md"
keywords = ["memory", "ai", "robotics", "zenoh", "cognitive"]
categories = ["science", "database", "embedded"]
exclude = [
    "mcp-server/",
    "python/",
    "docker/",
    "test_memory_db/",
    "shodh_memory_data/",
    "*.exe",
    "*.tar.gz",
    "*.dll",
    "*.zip",
    "*.whl",
    "*.pdf",
    "*.odt",
    # No packaging exception is needed for HTML any more: the two bundled
    # viewers were retired and the crate no longer `include_str!`s any .html.
    "*.html",
    "*.py",
    "*.log",
    "*.json",
    "!src/entity_type/entity-type-schema.json",
    "!Cargo.lock",
    "job_log.txt",
    "macos_log.txt",
    "full_log.txt",
    "hook_*.txt",
    ".mcp.json",
    "nul",
    "install_bun.ps1",
    ".venv/",
    ".claude/",
    "assets/",
    "benchmarks/",
    "benchmark_report.json",
    "bugs-remedies/",
    "docker-compose.yml",
    "Dockerfile",
    "examples/",
    "hooks/",
    "marketing/",
    "notebooks/",
    "release-test/",
    "seps/",
    "skills/",
    "test_*/",
    "*.md",
    "!README-rust.md",
    "openapi.yaml",
    "shodh_logo_nobackground.png",
    "shodh_config.example.json",
    "STPI_PITCH_DECK.md",
    ".github/",
    "pyproject.toml",
    "C*facts_out.json",
    "tui/",
    "signature.JPG",
    "start_server.bat",
    "*.ts",
    "*.patch",
    "*.diff",
    "*.png",
    "!src/**",
    "scripts/",
    "clippy_output.txt",
    "C*clippy_out.txt",
    ".smithery/",
    "drafts/",
]

[lib]
name = "shodh_memory"
path = "src/lib.rs"
# rlib: for Rust library usage (tests, benchmarks, binary)
# cdylib: for Python bindings (PyO3/maturin needs shared library)
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "shodh-memory-server"
path = "src/main.rs"

[[bin]]
name = "shodh"
path = "src/cli.rs"

[[bin]]
name = "recall-eval"
path = "src/bin/recall_eval.rs"

[dependencies]
# Vendored pure-Rust spaCy pipeline (dependency-head parser + POS + lemma) for
# entity-resolution span-cleaning. Native, no external fetch. Model bundle loaded
# at runtime from SHODH_SPACY_MODEL_PATH (asset not committed, like GLiNER/MiniLM).
spacy-rusty = { path = "crates/spacy-rusty" }
# MCP Protocol
rmcp = { version = "0.12", features = ["server", "macros", "transport-io"] }
clap = { version = "4.5", features = ["derive", "env"] }
# Global allocator — replaces Windows default heap (eliminates segment doubling / commit bloat)
mimalloc = "0.1"

# Core
anyhow = "1.0"
thiserror = "2.0"
dotenvy = "0.15"  # Load .env files

# Async runtime & web server
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }  # SSE event streaming (sync for BroadcastStream)
tokio-util = { version = "0.7", features = ["rt"] }  # TaskTracker for graceful shutdown of background tasks
futures = "0.3"  # Stream utilities for SSE
axum = { version = "0.8", features = ["json", "ws"] }
tower = { version = "0.5", features = ["limit", "buffer", "load-shed"] }
tower-http = { version = "0.6", features = ["cors", "fs", "timeout"] }
tower_governor = { version = "0.8", features = ["axum"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
form_urlencoded = "1"

# Storage
postcard = { version = "1", features = ["alloc"] }
bincode = { version = "2", features = ["serde"] }
bincode1 = { package = "bincode", version = "1.3" }  # Legacy format support for pre-2.0 memories
rmp-serde = "1.3"  # MessagePack - binary format that supports serde tagged enums
lz4 = "1.28"

# Concurrency
parking_lot = "0.12"
dashmap = "6.1"
moka = { version = "0.12", features = ["sync"] }  # Lock-free concurrent cache with LRU eviction

# Utilities
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lru = "0.16.3"
regex = "1.12"
rust-stemmers = "1.2"  # Porter2 stemming for linguistic analysis
dirs = "6.0"  # Platform-specific directory paths
dateparser = "0.2"  # Safe natural language date parsing (returns Result, no panic)
glob = "0.3"  # Pattern matching for file paths
yake-rust = "1.0"  # Statistical keyword extraction (position, frequency, capitalization)

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Observability (P1.1)
prometheus = "0.14"

# Distributed Tracing (P1.6) - OPTIONAL (heavy, ~200 packages, not needed for edge)
# NOTE: tracing-opentelemetry 0.28 requires opentelemetry 0.27
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry = { version = "0.27", features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["trace", "grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"], optional = true }

# Vector operations (lightweight)
ordered-float = "5.0"

# Vector database (Vamana HNSW)
memmap2 = "0.9"
rand = "0.8"

# ONNX Runtime for embeddings (MiniLM-L6-v2)
# Using load-dynamic for runtime DLL loading (bundled in wheels)
# CRT conflicts solved via .cargo/config.toml: -crt-static
ort = { version = "2.0.0-rc.11", default-features = false, features = ["load-dynamic", "half"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.16"

# Graph visualization
petgraph = "0.8"

# Full-text search (BM25)
tantivy = "0.25"

# Bloom filter
bloomfilter = "3.0"

# Base64 encoding
base64 = "0.22"

# Backup & Restore (P2) + Model checksum verification (P1)
sha2 = "0.10"
hex = "0.4"

# MIF encryption (AES-256-GCM)
aes-gcm = "0.10"

# External integrations (SHO-40)
hmac = "0.12"
subtle = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Auto-download for models and ONNX runtime
ureq = { version = "3.0", features = ["json"] }
zip = { version = "7.0", default-features = false, features = ["deflate"] }
flate2 = "1.1"
tar = "0.4"

# Python bindings (optional)
# NOTE: pyo3 >= 0.24.1 required for RUSTSEC-2025-0020 (buffer overflow fix)
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.24", optional = true }

# Zenoh transport for robotics (optional — pure Rust, zero C deps)
# Enables pub/sub + request/reply integration with ROS2 via rmw_zenoh or zenoh-bridge-ros2dds
zenoh = { version = "1.1", default-features = false, features = ["transport_tcp", "transport_udp"], optional = true }

# Agent loop harness (optional — conversational-seat foundation, not in the edge default build)
# Pinned EXACTLY (= not ^): rig-core/rig-derive/rig-agent share one workspace version and the
# crate has shipped 48 breaking-change entries across its last two releases in ~40 days under a
# single dominant maintainer.
#
# DELIBERATELY `rig-core`, NOT the `rig` facade crate: `rig = "=0.41.0"` transitively pulls
# `rig-fastembed` -> `fastembed` -> `ort` (ONNX Runtime, an ML inference runtime) at a version
# that conflicts with this crate's own `ort` pin and would double our embedding-runtime
# footprint even if it didn't conflict. `rig-core` alone carries none of that — confirmed via
# `cargo tree --features agent-harness` (see below): only reqwest/tokio/serde/tracing/schemars.
# No candle, no tokenizers, no onnx/ort, no vector-store crate. Default features only
# (reqwest, derive, rustls) — no provider feature flags enabled here.
#
# --- aws-lc-rs / aws-lc-sys: investigated, unavoidable while `rustls` is enabled ---
# Enabling this feature adds `aws-lc-rs` + `aws-lc-sys` to Cargo.lock. `aws-lc-sys` has a
# non-optional `[build-dependencies.cmake]` (its own Cargo.toml) and compiles a C/assembly
# library, which is a real build-toolchain cost on air-gapped/reproducible edge builds. This
# was investigated, not accepted blindly:
#   - Our own `reqwest` (0.12, above) already uses rustls — but its `rustls-tls` feature
#     resolves to reqwest 0.12's `__rustls-ring` internal feature, i.e. the `ring` crypto
#     provider, not aws-lc-rs. `ring` was already in this project's dependency graph before
#     this feature existed.
#   - `rig-core`'s `rustls` feature (part of its `default`) enables `reqwest/rustls` on ITS
#     `reqwest = "0.13"` dependency. reqwest 0.13's `rustls` feature hardcodes
#     `__rustls-aws-lc-rs` — confirmed by reading reqwest 0.13.4's published Cargo.toml
#     (`grep ring` on it returns nothing at all: the `ring`-backed rustls feature that existed
#     in reqwest 0.12 was removed entirely in the 0.13 series). There is no cargo-feature path
#     to make rig-core's HTTP client use `ring` instead — that choice is baked into reqwest
#     0.13 upstream, not exposed as a selectable feature.
#   - Because our own reqwest 0.12 and rig-core's reqwest 0.13 both transitively depend on the
#     *same* `rustls`/`rustls-webpki` crate versions, Cargo's feature unification enables BOTH
#     `ring` and `aws-lc-rs` on that one shared `rustls` node — confirmed in
#     `cargo tree --features agent-harness`, where a single `rustls v0.23.35` node lists both
#     `aws-lc-rs` and `ring` as direct dependencies.
#   - The only alternative rig-core exposes is its `native-tls` feature (OS-native TLS:
#     SChannel/Secure Transport/OpenSSL) instead of `rustls`. Rejected: it would put a SECOND,
#     different TLS/cert-verification stack into the binary alongside the `ring`-backed rustls
#     stack our own `reqwest` already uses, instead of reusing it, and on this project's
#     primary edge targets (Raspberry Pi / drone Linux-ARM, per the crate description above)
#     `native-tls` means either dynamically linking system OpenSSL (dev headers must be
#     preinstalled — worse for air-gapped builds than a vendored cmake build) or OpenSSL's
#     `vendored` feature (an even larger C codebase than aws-lc, built with OpenSSL's own
#     Configure+make, not cmake). Neither is a better trade for this project's offline/edge
#     profile than accepting aws-lc-sys.
#   - Conclusion: kept `rustls` (default). The cmake build-toolchain requirement is real but
#     scoped entirely to this opt-in, non-`default` feature — it is not paid by the edge-device
#     default build.
#
# --- jni / jni-sys / jni-macros / jni-sys-macros: present in Cargo.lock, NOT compiled here ---
# These come from `rustls-platform-verifier` (pulled in by reqwest 0.13's `rustls` feature,
# for OS-native certificate-store verification). Reading rustls-platform-verifier 0.7.0's
# Cargo.toml shows its `jni` dependency is declared under
# `[target.'cfg(target_os = "android")'.dependencies.jni]` — Android-only. Cargo.lock records
# the full cross-platform dependency graph regardless of host, so these names appear there,
# but `cargo tree --features agent-harness` (which resolves for the current host target) does
# NOT list `jni` anywhere in the rig-core subtree on Windows, Linux, or macOS. Confirmed: zero
# build-time or binary-size cost on every platform this project actually ships to.
#
# Re-run `cargo tree --features agent-harness` by hand before ever bumping this pin, and
# re-check both investigations above if the pin moves to a new rig-core/reqwest major version.
rig-core = { version = "=0.41.0", optional = true }

# LLM-based query parsing (optional - heavy dependency)

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
http-body-util = "0.1"
tempfile = "3.24"

[[bench]]
name = "memory_benchmarks"
harness = false

[[bench]]
name = "graph_benchmarks"
harness = false

[[bench]]
name = "adaptive_memory_benchmarks"
harness = false

[[bench]]
name = "cognitive_benchmarks"
harness = false

[[bench]]
name = "ner_benchmarks"
harness = false

[[bench]]
name = "pipeline_benchmarks"
harness = false

[[bench]]
name = "associative_retrieval_benchmarks"
harness = false

[[bench]]
name = "streaming_benchmarks"
harness = false

[[bench]]
name = "relevance_benchmarks"
harness = false

[[bench]]
name = "integration_benchmarks"
harness = false

[[bench]]
name = "hebbian_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # Reduce binary size
panic = "abort"

[profile.bench]
# Note: bench profile inherits from release by default
# panic cannot be overridden when inheriting (Cargo limitation)
# Criterion benchmarks work with panic = "abort" in release mode
opt-level = 3
lto = "thin"  # Faster build than full LTO for benchmarks


[features]
# Default: minimal dependencies for edge devices (Raspberry Pi, drones, robotics)
default = []

# Python bindings for PyO3
python = ["pyo3", "numpy"]

# Optional: LLM-based query parser (future: requires API key)
llm-parser = []

# Optional: Zenoh transport for robotics/ROS2 (pure Rust, cross-platform)
zenoh = ["dep:zenoh"]

# Optional: agent loop harness (rig-backed ConversationMemory + Continual Harness state).
# Not part of `default` — this is a conversational-seat feature, not an edge-device concern,
# and rig is pinned exactly (see dependency comment) so it stays opt-in until that pin is
# deliberately re-reviewed.
agent-harness = ["dep:rig-core"]

# Optional: Distributed tracing for cloud/multi-node deployments (~200 extra packages)
telemetry = [
    "tracing-opentelemetry",
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry_sdk"
]


# jemalloc replaces the system C allocator inside RocksDB's C++ code (not just Rust).
# Without it, glibc/CRT malloc fragments heavily and never returns memory to the OS.
# Confirmed fix by rust-rocksdb maintainer (zaidoon1) in facebook/rocksdb#12364.
# PRs #989 (ran-openai) and #1026 (timothyg-stripe) fixed jemalloc linking in v0.24.0.
[target.'cfg(not(windows))'.dependencies]
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "jemalloc"] }

# jemalloc doesn't compile with MSVC — Windows uses default CRT allocator.
# Fundamental fix requires facebook/rocksdb#14403 (custom allocator C API for mimalloc).
[target.'cfg(windows)'.dependencies]
rocksdb = { version = "0.24", default-features = false, features = ["lz4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]
# Standalone workspace - not part of parent kalki-v2
members = ["crates/spacy-rusty"]
