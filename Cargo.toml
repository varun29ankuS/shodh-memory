[package]
name = "shodh-memory"
version = "0.2.0"
edition = "2021"
authors = ["Shodh Team <29.varuns@gmail.com>"]
description = "Persistent cognitive memory for AI agents and robots — Hebbian learning, knowledge graph, spatial recall. Zenoh/ROS2 native. Single binary, runs offline."
license = "Apache-2.0"
repository = "https://github.com/varun29ankuS/shodh-memory"
homepage = "https://github.com/varun29ankuS/shodh-memory"
readme = "README-rust.md"
keywords = ["memory", "ai", "robotics", "zenoh", "cognitive"]
categories = ["science", "database", "embedded"]
exclude = [
    "mcp-server/",
    "python/",
    "docker/",
    "test_memory_db/",
    "shodh_memory_data/",
    "*.exe",
    "*.tar.gz",
    "*.dll",
    "*.zip",
    "*.whl",
    "*.pdf",
    "*.odt",
    # No packaging exception is needed for HTML any more: the two bundled
    # viewers were retired and the crate no longer `include_str!`s any .html.
    "*.html",
    "*.py",
    "*.log",
    "*.json",
    "!src/entity_type/entity-type-schema.json",
    # The embedded en_core_web_sm manifest is `include_str!`d, so the blanket
    # "*.json" exclusion above would break a packaged build.
    #
    # NOTE: at ~14.4 MiB the bundle puts a packaged crate over the crates.io
    # 10 MiB limit. That is not a NEW break — `spacy-rusty` is a version-less
    # path dependency, which already makes `cargo publish` fail — but whoever
    # fixes the path dep must also solve the asset size (raised limit, or a
    # feature-gated download).
    "!src/dep_parser/en_core_web_sm/model.json",
    "!Cargo.lock",
    "job_log.txt",
    "macos_log.txt",
    "full_log.txt",
    "hook_*.txt",
    ".mcp.json",
    "nul",
    "install_bun.ps1",
    ".venv/",
    ".claude/",
    "assets/",
    "benchmarks/",
    "benchmark_report.json",
    "bugs-remedies/",
    "docker-compose.yml",
    "Dockerfile",
    "examples/",
    "hooks/",
    "marketing/",
    "notebooks/",
    "release-test/",
    "seps/",
    "skills/",
    "test_*/",
    "*.md",
    "!README-rust.md",
    "openapi.yaml",
    "shodh_logo_nobackground.png",
    "shodh_config.example.json",
    "STPI_PITCH_DECK.md",
    ".github/",
    "pyproject.toml",
    "C*facts_out.json",
    "tui/",
    "signature.JPG",
    "start_server.bat",
    "*.ts",
    "*.patch",
    "*.diff",
    "*.png",
    "!src/**",
    "scripts/",
    "clippy_output.txt",
    "C*clippy_out.txt",
    ".smithery/",
    "drafts/",
]

[lib]
name = "shodh_memory"
path = "src/lib.rs"
# rlib: for Rust library usage (tests, benchmarks, binary)
# cdylib: for Python bindings (PyO3/maturin needs shared library)
#
# The cdylib forces cargo to emit this lib with an unhashed filename, which is
# why `[profile.release]` must not set `panic` — see the note there before
# touching either line.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "shodh-memory-server"
path = "src/main.rs"

[[bin]]
name = "shodh"
path = "src/cli.rs"

[[bin]]
name = "recall-eval"
path = "src/bin/recall_eval.rs"

[dependencies]
# Vendored pure-Rust spaCy pipeline (dependency-head parser + POS + lemma) for
# entity-resolution span-cleaning. Native, no external fetch. Model bundle loaded
# at runtime from SHODH_SPACY_MODEL_PATH (asset not committed, like GLiNER/MiniLM).
spacy-rusty = { path = "crates/spacy-rusty" }
# MCP Protocol
rmcp = { version = "1.4", features = ["server", "macros", "transport-io"] }
clap = { version = "4.5", features = ["derive", "env"] }
# Global allocator — replaces Windows default heap (eliminates segment doubling / commit bloat)
mimalloc = "0.1"

# Core
anyhow = "1.0"
thiserror = "2.0"
dotenvy = "0.15"  # Load .env files

# Async runtime & web server
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }  # SSE event streaming (sync for BroadcastStream)
tokio-util = { version = "0.7", features = ["rt"] }  # TaskTracker for graceful shutdown of background tasks
futures = "0.3"  # Stream utilities for SSE
axum = { version = "0.8", features = ["json", "ws"] }
tower = { version = "0.5", features = ["limit", "buffer", "load-shed"] }
tower-http = { version = "0.7", features = ["cors", "fs", "timeout"] }
tower_governor = { version = "0.8", features = ["axum"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
form_urlencoded = "1"

# Storage
postcard = { version = "1", features = ["alloc"] }
bincode = { version = "2", features = ["serde"] }
bincode1 = { package = "bincode", version = "1.3" }  # Legacy format support for pre-2.0 memories
rmp-serde = "1.3"  # MessagePack - binary format that supports serde tagged enums
lz4 = "1.28"

# Concurrency
parking_lot = "0.12"
dashmap = "6.1"
moka = { version = "0.12", features = ["sync"] }  # Lock-free concurrent cache with LRU eviction

# Utilities
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lru = "0.16.3"
regex = "1.12"
rust-stemmers = "1.2"  # Porter2 stemming for linguistic analysis
dirs = "6.0"  # Platform-specific directory paths
dateparser = "0.2"  # Safe natural language date parsing (returns Result, no panic)
glob = "0.3"  # Pattern matching for file paths
yake-rust = "1.0"  # Statistical keyword extraction (position, frequency, capitalization)

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Observability (P1.1)
prometheus = "0.14"

# Distributed Tracing (P1.6) - OPTIONAL (heavy, ~200 packages, not needed for edge)
# NOTE: tracing-opentelemetry minor must track the opentelemetry minor + 1
# (0.33 requires opentelemetry 0.32). opentelemetry_sdk >= 0.32.1 required
# for CVE-2026-48504 (unbounded W3C Baggage allocation).
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32", features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["trace", "grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "rt-tokio"], optional = true }

# Vector operations (lightweight)
ordered-float = "5.0"

# Vector database (Vamana HNSW)
memmap2 = "0.9"
rand = "0.8"

# ONNX Runtime for embeddings (MiniLM-L6-v2)
# Using load-dynamic for runtime DLL loading (bundled in wheels)
# CRT conflicts solved via .cargo/config.toml: -crt-static
ort = { version = "2.0.0-rc.11", default-features = false, features = ["load-dynamic", "half"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.16"

# Graph visualization
petgraph = "0.8"

# Full-text search (BM25)
tantivy = "0.26"

# Bloom filter
bloomfilter = "3.0"

# Base64 encoding
base64 = "0.22"

# Backup & Restore (P2) + Model checksum verification (P1)
sha2 = "0.10"
hex = "0.4"

# MIF encryption (AES-256-GCM)
aes-gcm = "0.10"

# External integrations (SHO-40)
hmac = "0.12"
subtle = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Auto-download for models and ONNX runtime
ureq = { version = "3.0", features = ["json"] }
zip = { version = "7.0", default-features = false, features = ["deflate"] }
flate2 = "1.1"
tar = "0.4"

# Python bindings (optional)
# NOTE: pyo3 >= 0.29 required for RUSTSEC-2026-0176 (OOB read in PyList/PyTuple
# iterators) and RUSTSEC-2026-0177 (missing Sync bound on new_closure);
# >= 0.24.1 was required for RUSTSEC-2025-0020 (buffer overflow fix)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.29", optional = true }

# Zenoh transport for robotics (optional — pure Rust, zero C deps)
# Enables pub/sub + request/reply integration with ROS2 via rmw_zenoh or zenoh-bridge-ros2dds
zenoh = { version = "1.1", default-features = false, features = ["transport_tcp", "transport_udp"], optional = true }

# LLM-based query parsing (optional - heavy dependency)

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
http-body-util = "0.1"
tempfile = "3.24"

[[bench]]
name = "memory_benchmarks"
harness = false

[[bench]]
name = "graph_benchmarks"
harness = false

[[bench]]
name = "adaptive_memory_benchmarks"
harness = false

[[bench]]
name = "cognitive_benchmarks"
harness = false

[[bench]]
name = "ner_benchmarks"
harness = false

[[bench]]
name = "pipeline_benchmarks"
harness = false

[[bench]]
name = "associative_retrieval_benchmarks"
harness = false

[[bench]]
name = "streaming_benchmarks"
harness = false

[[bench]]
name = "relevance_benchmarks"
harness = false

[[bench]]
name = "integration_benchmarks"
harness = false

[[bench]]
name = "hebbian_benchmarks"
harness = false

# Cargo's default dev profile is `debug = true` — full DWARF/PDB debug info for
# the workspace *and* for every dependency. On this crate that is not a rounding
# error: the debug tree measured 29.7 GB, of which 3.46 GB was seven PDB files
# and most of the 5.97 GB of rlibs was dependency debug info that nothing here
# reads. Dependencies are not stepped through, so they get none; the workspace
# keeps line tables, which is everything a backtrace or a failing test needs to
# name a file and a line. Full variable inspection under a debugger is the only
# thing given up, and that is recovered by building with `--profile dev-debug`
# below when it is actually wanted.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Tests inherit `dev`, so the same reasoning applies — stated explicitly rather
# than relied upon, because a future `[profile.dev]` edit should not silently
# change what `cargo test` emits.
[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

# Opt-in full debuginfo, for the rare session that needs a real debugger:
#   cargo build --profile dev-debug
[profile.dev-debug]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # Reduce binary size

# `panic = "abort"` is deliberately NOT set here, and must not be re-added while
# `[lib] crate-type` contains `cdylib`. The two are incompatible in this crate:
#
#   * A lib target that emits a cdylib needs a stable, unhashed artifact name,
#     so cargo compiles the whole unit without `-C extra-filename` — the rlib
#     lands at `deps/libshodh_memory.rlib` with no metadata suffix.
#   * `panic = "abort"` forces cargo to build that same lib TWICE whenever a
#     rustc test harness is in the graph (harnesses require unwind, bins get
#     abort). Two units, two `-C metadata` values, one filename.
#
# The result is the collision of rust-lang/cargo#6313: both variants write
# `libshodh_memory.rlib`, the loser is silently clobbered, and whatever consumes
# it is linked against a crate whose SVH and dependency set are not the ones it
# was compiled against. `cargo test --release --test <any>` was unbuildable that
# way — surfacing as 16 LNK2019 unresolved `shodh_memory` symbols, or as E0599
# on `anyhow::Context` / E0277 on `serde::Serialize`, depending on which variant
# happened to be written last. `cargo check` never showed it because check emits
# no cdylib. CI never showed it because no job ran `cargo test --release`.
#
# Removing the setting also repairs a live production defect: the two
# `std::panic::catch_unwind` guards in `src/dep_parser/mod.rs` (which exist so a
# corrupt model bundle degrades the parser to `None` instead of taking down a
# request thread) are no-ops under abort — the process dies instead.

[profile.bench]
# Note: bench profile inherits from release by default
opt-level = 3
lto = "thin"  # Faster build than full LTO for benchmarks


[features]
# Default: minimal dependencies for edge devices (Raspberry Pi, drones, robotics)
default = []

# Python bindings for PyO3
python = ["pyo3", "numpy"]

# Optional: LLM-based query parser (future: requires API key)
llm-parser = []

# Optional: Zenoh transport for robotics/ROS2 (pure Rust, cross-platform)
zenoh = ["dep:zenoh"]

# Optional: Distributed tracing for cloud/multi-node deployments (~200 extra packages)
telemetry = [
    "tracing-opentelemetry",
    "opentelemetry",
    "opentelemetry-otlp",
    "opentelemetry_sdk"
]


# jemalloc replaces the system C allocator inside RocksDB's C++ code (not just Rust).
# Without it, glibc/CRT malloc fragments heavily and never returns memory to the OS.
# Confirmed fix by rust-rocksdb maintainer (zaidoon1) in facebook/rocksdb#12364.
# PRs #989 (ran-openai) and #1026 (timothyg-stripe) fixed jemalloc linking in v0.24.0.
[target.'cfg(not(windows))'.dependencies]
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "jemalloc"] }

# jemalloc doesn't compile with MSVC — Windows uses default CRT allocator.
# Fundamental fix requires facebook/rocksdb#14403 (custom allocator C API for mimalloc).
[target.'cfg(windows)'.dependencies]
rocksdb = { version = "0.24", default-features = false, features = ["lz4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]
# Standalone workspace - not part of parent kalki-v2
members = ["crates/spacy-rusty"]
