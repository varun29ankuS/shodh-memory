name: Recall Harness

# RH-5 (#267): gate PRs on retrieval-quality regressions against the
# checked-in `tests/recall/locomo-gate-baseline.json`. The `recall-eval` binary owns
# the comparison and exit code; this workflow's job is just to:
#
#   1. Build the binary (release).
#   2. Run the smoke suite with `--baseline tests/recall/locomo-gate-baseline.json`.
#   3. Render a markdown diff table.
#   4. Post that table as a PR comment (idempotent — edits its own prior
#      comment instead of stacking).
#   5. Upload the JSON report as an artifact for offline inspection.
#
# Runtime budget: cold ~12 min (LLVM + cold release build), warm ~3-4 min.
# The "<2 min" target in #267 is unrealistic without building on a
# dedicated runner — flagged in the PR description.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/recall/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/recall.yml'
      - 'scripts/recall_diff.py'
  workflow_dispatch:
    inputs:
      tolerance:
        description: 'Allowed regression in percent of baseline'
        required: false
        default: '2.0'
      layer:
        description: 'Layer attribution: full (gated) or all (per-stage diagnosis)'
        required: false
        default: 'full'
      repeats:
        description: 'Ingest+query repeats (use 1 for a fast diagnosis run)'
        required: false
        default: '5'
      suite:
        description: >-
          Which suite. `locomo-gate` is the 100-case PR gate. `locomo` is the
          1,531-case held-out set - use it to settle a question the gate cannot
          resolve, since whole-case metrics move in steps of 1/n and the gate's
          step is 0.01 overall and 0.04 on multi_hop, both larger than a 2%
          allowance. Slow; diagnostic, not a gate.
        required: false
        default: 'locomo-gate'
        type: choice
        options: ['locomo-gate', 'locomo']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: recall-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TOLERANCE: ${{ github.event.inputs.tolerance || '2.0' }}
  # PR runs are always the gated `full`/5; only a manual dispatch can widen to
  # per-stage diagnosis (`all`) or a fast single repeat.
  LAYER: ${{ github.event.inputs.layer || 'full' }}
  REPEATS: ${{ github.event.inputs.repeats || '5' }}
  # PR runs are always the gated 100-case suite; only a manual dispatch can
  # reach the 1,531-case held-out set.
  SUITE: ${{ github.event.inputs.suite || 'locomo-gate' }}

jobs:
  smoke:
    name: L1 Smoke Suite
    runs-on: ubuntu-latest
    # RH-12 (#272): with --repeats 5 the suite runs 5 independent
    # ingest+query passes (~5-6min each on a warm runner) plus build.
    # 60min keeps headroom for cold builds and unusually slow runners.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: recall-eval
          # Cache the recall-eval binary specifically; debug profile is unused here.
          cache-targets: 'true'
          cache-on-failure: 'true'

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      # The production typer is GLiNER bi-edge (ONNX); the recall harness refuses
      # to measure the FALLBACK NER (results would not reflect the shipped system).
      # Assets are published as a repo release and cached by tag.
      - name: Cache GLiNER typer assets
        id: gliner-cache
        uses: actions/cache@v6
        with:
          path: models/gliner-bi-edge
          key: gliner-bi-edge-onnx-v1

      - name: Fetch GLiNER typer assets
        if: steps.gliner-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models/gliner-bi-edge
          gh release download gliner-bi-edge-onnx-v1 --repo "$GITHUB_REPOSITORY" --dir models/gliner-bi-edge
          ls -la models/gliner-bi-edge

      # Pre-supply the MiniLM embedder the same way ci.yml's Build job does
      # (shared cache keys — a warm cache means neither workflow touches
      # HuggingFace). Without this the eval binary downloads MiniLM at runtime,
      # and one HF hiccup fails the gate as `infrastructure` — which is exactly
      # how run 31227613424 went red on a PR whose quality deltas were +0.0000.
      # SHODH_ALLOW_SIMPLIFIED_EMBEDDINGS is never set here: degrading the
      # embedder would make the recall numbers meaningless.
      - name: Cache MiniLM embedder weights
        id: minilm-cache
        uses: actions/cache@v6
        with:
          path: models/minilm-l6
          key: minilm-l6-c9745ed1-v1

      - name: Fetch MiniLM embedder weights
        if: steps.minilm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p models/minilm-l6
          BASE="https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/c9745ed1d9f207416be6d2e6f8de32d1f16199bf"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 -o models/minilm-l6/model_quantized.onnx "$BASE/onnx/model_quint8_avx2.onnx"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 -o models/minilm-l6/tokenizer.json "$BASE/tokenizer.json"
          ls -la models/minilm-l6

      - name: Verify model assets (hard gate — refuse to run on missing/degraded assets)
        run: |
          SHODH_MODEL_PATH="${{ github.workspace }}/models/minilm-l6"
          SHODH_GLINER_MODEL_PATH="${{ github.workspace }}/models/gliner-bi-edge"
          test -s "$SHODH_MODEL_PATH/model_quantized.onnx" || { echo "::error::MiniLM weights missing"; exit 1; }
          test -s "$SHODH_MODEL_PATH/tokenizer.json" || { echo "::error::MiniLM tokenizer missing"; exit 1; }
          test -s "$SHODH_GLINER_MODEL_PATH/model.onnx" || { echo "::error::GLiNER model missing — refusing to measure fallback NER"; exit 1; }
          test -s "$SHODH_GLINER_MODEL_PATH/tokenizer.json" || { echo "::error::GLiNER tokenizer missing"; exit 1; }
          test -s "$SHODH_GLINER_MODEL_PATH/label_embeddings.bin" || { echo "::error::GLiNER label embeddings missing"; exit 1; }

      - name: Verify baseline is checked in
        run: |
          if [ ! -f tests/recall/locomo-gate-baseline.json ]; then
            echo "::error::tests/recall/locomo-gate-baseline.json is missing — see tests/recall/README.md to regenerate."
            exit 1
          fi
          BASELINE_SHA=$(jq -r '.git_sha' tests/recall/locomo-gate-baseline.json)
          BASELINE_EMBEDDER=$(jq -r '.embedder' tests/recall/locomo-gate-baseline.json)
          echo "Baseline: sha=$BASELINE_SHA embedder=$BASELINE_EMBEDDER"
          echo "BASELINE_SHA=$BASELINE_SHA" >> $GITHUB_ENV
          echo "BASELINE_EMBEDDER=$BASELINE_EMBEDDER" >> $GITHUB_ENV

      - name: Build recall-eval
        run: cargo build --release --bin recall-eval

      - name: Run L1 smoke suite vs. baseline
        id: run_eval
        env:
          SHODH_MODEL_PATH: ${{ github.workspace }}/models/minilm-l6
          SHODH_GLINER_MODEL_PATH: ${{ github.workspace }}/models/gliner-bi-edge
        run: |
          set +e
          # RH-12 (#272): --repeats 5 → per-case latency is the median
          # across 5 independent ingest+query passes; rank-list divergence
          # across passes is hard-failed as `infrastructure`.
          ./target/release/recall-eval \
            --suite "${SUITE}" \
            --layer "${LAYER}" \
            --repeats "${REPEATS}" \
            --output current.json \
            --per-case-output per-case.json \
            --baseline tests/recall/locomo-gate-baseline.json \
            --tolerance "${TOLERANCE}" \
            --storage ./recall-storage 2>&1 | tee recall-eval.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          # Don't fail the job yet — we want the comment-posting step to run first
          # so reviewers see the diff even on regression.
          exit 0

      - name: Render diff table
        id: render
        if: always() && hashFiles('current.json') != ''
        run: |
          python3 scripts/recall_diff.py \
            tests/recall/locomo-gate-baseline.json \
            current.json \
            --tolerance "${TOLERANCE}" > recall-diff.md
          {
            echo 'body<<RECALL_DIFF_EOF'
            cat recall-diff.md
            echo 'RECALL_DIFF_EOF'
          } >> "$GITHUB_OUTPUT"
          cat recall-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON report
        if: always() && hashFiles('current.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: recall-eval-report
          path: |
            current.json
            per-case.json
            recall-eval.log
            recall-diff.md
          if-no-files-found: warn
          retention-days: 30

      - name: Post or update PR comment
        if: |
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('recall-diff.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Stable HTML-comment marker rendered by `scripts/recall_diff.py`
          # (kept in sync with `COMMENT_MARKER` in that file). Plain ASCII
          # so it survives shell quoting unchanged.
          MARKER: '<!-- recall-harness-comment-marker:rh-5 -->'
        run: |
          # Find an existing comment by this workflow (identified by the
          # marker line) and edit it; otherwise create a new one. Keeps
          # noisy PRs from accumulating one comment per push.
          EXISTING_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            | jq --arg marker "$MARKER" '.[] | select(.body | contains($marker)) | .id' \
            | head -n1)
          if [ -n "$EXISTING_ID" ]; then
            echo "Editing existing comment $EXISTING_ID"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_ID}" \
              -F body="@recall-diff.md"
          else
            echo "Creating new PR comment"
            gh pr comment "$PR_NUMBER" --body-file recall-diff.md
          fi

      - name: Enforce gate
        if: always()
        env:
          EXIT: ${{ steps.run_eval.outputs.exit_code }}
        run: |
          case "$EXIT" in
            0)
              echo "::notice::Recall gate passed within ${TOLERANCE}% tolerance."
              ;;
            1)
              echo "::error::Recall regression detected — see PR comment / artifact for details."
              exit 1
              ;;
            2)
              echo "::error::Recall harness infrastructure failure — see recall-eval.log artifact."
              exit 1
              ;;
            *)
              echo "::error::recall-eval exited with unexpected code $EXIT."
              exit 1
              ;;
          esac
